<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Movie Genre Predictor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #d8d8d8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 130px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #ff4757;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #ff6b81;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 22px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
        }

        .genre {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }

        .confidence {
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .reason {
            color: #ddd;
            line-height: 1.6;
        }

        .error {
            color: #ffb3b3;
            text-align: center;
        }

        .loading {
            text-align: center;
            display: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 AI Movie Genre Predictor</h1>

    <p class="subtitle">
        Enter a movie title and/or description and let AI predict its genre.
    </p>

    <form id="movieForm">

        <label for="title">Movie Title</label>

        <input
            type="text"
            id="title"
            placeholder="Example: Inception"
        >

        <label for="description">Movie Description</label>

        <textarea
            id="description"
            placeholder="Example: A thief enters people's dreams to steal secrets..."
        ></textarea>

        <button type="submit" id="predictButton">
            Predict Genre
        </button>

    </form>

    <div class="loading" id="loading">
        🤖 AI is analyzing the movie...
    </div>

    <div class="result" id="result">

        <div class="genre" id="genre"></div>

        <div class="confidence" id="confidence"></div>

        <div class="reason" id="reason"></div>

    </div>

</div>

<script>
    const form = document.getElementById("movieForm");
    const button = document.getElementById("predictButton");
    const loading = document.getElementById("loading");
    const result = document.getElementById("result");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const title = document.getElementById("title").value.trim();
        const description =
            document.getElementById("description").value.trim();

        result.style.display = "none";

        if (!title && !description) {
            result.style.display = "block";
            document.getElementById("genre").innerHTML = "";
            document.getElementById("confidence").innerHTML = "";
            document.getElementById("reason").innerHTML =
                '<div class="error">Please enter a movie title or description.</div>';
            return;
        }

        button.disabled = true;
        loading.style.display = "block";

        try {

            const response = await fetch("/predict", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    title: title,
                    description: description
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Something went wrong.");
            }

            document.getElementById("genre").textContent =
                data.genre;

            document.getElementById("confidence").textContent =
                `Confidence: ${data.confidence}%`;

            document.getElementById("reason").textContent =
                data.reason;

            result.style.display = "block";

        } catch (error) {

            result.style.display = "block";

            document.getElementById("genre").innerHTML = "";

            document.getElementById("confidence").innerHTML = "";

            document.getElementById("reason").innerHTML =
                `<div class="error">${error.message}</div>`;

        } finally {

            button.disabled = false;
            loading.style.display = "none";
        }
    });
</script>

</body>
</html>
